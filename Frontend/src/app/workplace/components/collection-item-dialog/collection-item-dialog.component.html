<form
    [formGroup]="form"
    (submit)="onSubmit()"
    autocomplete="off"
>
    <div class="modal-body">
        <!-- Name input -->
        <div class="item-name">
            <label for="name" class="text-sm font-medium mb-2">Name</label>
            <input
                #nameInput
                pInputText
                id="name"
                autocomplete="off"
                formControlName="name"
                maxlength="255"
                type="text"
                placeholder="Enter name..."
            />
            <!-- Validation name error message -->
            <div *ngIf="isInvalidField('name')" class="mt-1">
                <shared-error-field [validationField]="getValidationField('name', 'name title')" />
            </div>
        </div>

        <!-- Emoji picker -->
        <div class="item-emoji">
            <label for="emoji" class="text-sm font-medium mb-2">Icon</label>        
            <div class="icon-container">
                <app-emoji-picker
                    #emoji
                    formControlName="emoji"
                    [defaultIconClass]="defaultPickerIconClass"
                />
            </div>
        </div>
    </div>

    <div class="modal-footer w-full flex justify-content-end gap-2">
        <!-- Cancel button -->
        <p-button
            id="cancelBtn"
            type="button"
            severity="secondary"
            label="Cancel"
            size="small"
            aria-label="cancel"
            (onClick)="onCancel()"
        />
        <!-- Submit button -->
        <p-button
            id="saveBtn"
            type="submit"
            severity="primary"
            label="Cancel"
            size="small"
            label="Save"
            aria-label="Save"
            [disabled]="submit"
        />
    </div>
</form>
