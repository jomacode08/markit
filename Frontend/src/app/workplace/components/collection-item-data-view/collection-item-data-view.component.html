<div class="flex align-items-center gap-5 mb-3">
    <!-- Filters -->
    <div class="filter-container flex gap-2">
        @for (filter of collectionItemTypeFilters; track $index) {
            <button 
                type="button"
                class="filter"
                [disabled]="loading()"
                [ngClass]="{ 'active' : currentFilter() === filter }"
                (click)="onFilterSelected.emit(filter)"
            >
                {{ filter }}
            </button>
        }
    </div>
    <!-- Loading spinner -->
    @if (displaySpinner()) {
        <p-progressSpinner
            strokeWidth="4"
            [style]="{
                width: '1.5rem',
                height: '1.5rem',
                margin: '0'
            }"
        ></p-progressSpinner>
    }
</div>

<!-- Data view -->
<p-dataView
    [value]="currentItems()()"
    [loading]="false"
    emptyMessage=" "
>
    <ng-template #list let-items>
        <!-- List template -->
        @for ( item of items; track $index) {
            <div appIntersection (viewChange)="onItemViewChange.emit($index)" class="item">
                <!-- Collection Item Information -->
                <button
                    type="button"
                    id="collectionItemBtn"
                    aria-label="See collection item"
                    (click)="onItemSelected(item)"
                    class="grid grid-nogutter w-full"
                >
                    <!-- Name and Description -->
                    <div class="col-8 md:col-6">
                        <span class="item-icon">
                            @if (item.emoji) {
                                <span class="emoji">{{ item.emoji }}</span>
                            }
                            @else {
                                <i [class]="(item.type | collectionItemIcon)"></i>
                            }
                        </span>
                        <div class="flex flex-column">
                            <span class="w-full font-medium text-base text-left">
                                {{ item.name }}
                            </span>
                            <span class="w-full font-light text-sm text-muted text-left">
                                {{ item.preview }}
                            </span>
                        </div>
                    </div>
                    <!-- Date -->
                    <div class="col-4 md:col-6 text-sm text-muted">
                        <span class="w-full text-right mr-3">
                            {{ item.updatedAt ?? item.createdAt | timeAgo }}
                        </span>
                    </div>
                </button>
                <!-- General actions -->
                <div class="actions-container flex-column gap-2 md:flex-row md:gap-3">
                    <!-- Favorite -->
                    <button (click)="onFavoriteClicked(item, $index)" [disabled]="item.updating" type="button">
                        <span *ngIf="!item.isFavorite; else fullStar" class="fa-regular fa-star text-lg text-muted"></span>
                    </button>
                    <!-- Other Actions -->
                    <button (click)="onItemActionsClicked(item)" type="button">
                        <span class="fa fa-ellipsis text-lg text-muted"></span>
                    </button>
                </div>
            </div>
        }
        <!-- No results template -->
        <div id="noResultsTemplate" *ngIf="items.length === 0 && !loading()" class="flex flex-column align-items-center justify-content-center py-7 px-3 fadein animation-duration-1000">
            <!-- Vector shape -->
            <shared-empty-state-icon/>
            <p class="mt-3 mb-0 text-xl font-semibold text-muted">Nothing to see here</p>
            <p class="mt-3 mb-0 text-muted max-w-24rem text-center">This place is empty. Create a new item or try a different location.</p>
        </div>
    </ng-template>
</p-dataView>

<!-- Floating menu -->
<shared-floating-menu
    #addItemMenu
    [options]="ADD_ITEM_ACTIONS"
    [dismissible]="true"
/>

<ng-template #fullStar>
    <span class="full-star fa fa-star text-lg"></span>
</ng-template>
