<div class="flex align-items-center flex-wrap gap-3">
    
    <!-- Path segments -->
    @for (segment of pathSegments(); track $index) {
        <button
            type="button"
            class="path-segment"
            [ngClass]="{ 'ml-0' : $index === 0 }"
            (click)="navigate(segment.collectionId, $index)"
        >
            <span [ngClass]="{ 'active' : segment.collectionId === currentIdCollection() }">
                {{ segment.name }}
            </span>
        </button>
        <span *ngIf="$index != pathSegments().length - 1" class="fa fa-angle-right separator"></span>
    }

</div>
