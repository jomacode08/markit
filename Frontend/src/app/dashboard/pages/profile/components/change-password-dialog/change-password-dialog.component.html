<form
    [formGroup]="form"
    (submit)="onSubmit()"
>
    <div class="modal-body">
        <div class="fields-container">
            <!-- Current password -->
            <div class="form-field">
                <label for="currentPassword">Current Password</label>
                <p-password
                    inputId="currentPassword"
                    formControlName="currentPassword"
                    autocomplete="current-password"
                    class="w-full"
                    inputStyleClass="w-full"
                    [feedback]="false"
                    [class.invalid]="isInvalidField('currentPassword')"
                ></p-password>
                @if (isInvalidField('currentPassword')) {
                    <shared-error-field [validationField]="getValidationField('currentPassword', 'current password')" />
                }
            </div>
            <!-- New password -->
            <div class="form-field">
                <label for="newPassword">New Password</label>
                <p-password
                    inputId="newPassword"
                    formControlName="newPassword"
                    autocomplete="new-password"
                    class="w-full"
                    inputStyleClass="w-full"
                    appendTo="body"
                    [toggleMask]="true"
                    [class.invalid]="isInvalidField('newPassword')"
                >
                    <ng-template #footer>
                    <ul class="font-light">
                        <li>At least one <b>uppercase</b></li>
                        <li>At least one <b>lowercase</b></li>
                        <li>At least one <b>numeric</b></li>
                        <li>Minimum <b>8 characters</b></li>
                    </ul>
                    </ng-template>
                </p-password>
                @if (isInvalidField('newPassword')) {
                    <shared-error-field [validationField]="getValidationField('newPassword','new password')" />
                }
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <p-button
            type="button"
            size="small"
            aria-label="Cancel"
            label="Cancel"
            severity="secondary"
            (onClick)="onCancel()"
            [disabled]="submit()"
        />
        <p-button
            type="submit"
            size="small"
            aria-label="Save"
            label="Save"
            severity="primary"
            [disabled]="submit()"
        />
    </div>
</form>
