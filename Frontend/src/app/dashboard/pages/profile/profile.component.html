@if (account$ | async; as account) {
    <div class="container">
        <!-- User Presentation -->
        <div class="user-box">
            <!-- User Picture -->
            <div class="avatar" [ngClass]="{'hidden' : isEditEnabled()}">
                @if (account.picture) {
                    <img class="border-circle" [src]="account.picture" alt="user picture" referrerpolicy="no-referrer">
                }
            </div>

            @if (isEditEnabled()) {
                <form
                    [formGroup]="form"
                    (submit)="onSubmit()"
                    autocomplete="off"
                >
                    <div class="flex gap-2 flex-wrap">
                        <div>
                            <!-- Name -->
                            <input 
                                id="name"
                                pInputText
                                formControlName="name"
                                type="text"
                                placeholder="Name"
                                class="rounded w-full sm:w-20rem"
                                autocomplete="off"
                            />
                            <!-- Name error message -->
                            <div class="w-15rem">
                                @if ( isInvalidField('name') ){
                                    <shared-error-field
                                        [validationField]="getValidationField('name')">
                                    </shared-error-field>
                                }
                            </div>
                        </div>
                        <div>
                            <!-- Save button -->
                            <p-button
                                id="saveBtn"
                                type="submit"
                                size="small"
                                aria-label="Save"
                                icon="fa fa-check"
                                severity="success"
                                [rounded]="true"
                                [text]="true"
                                [disabled]="submit()"
                            />
                            <!-- Cancel button -->
                            <p-button
                                id="cancelBtn"
                                type="button"
                                size="small"
                                aria-label="Cancel"
                                icon="fa-solid fa-xmark"
                                severity="danger"
                                [rounded]="true"
                                [text]="true"
                                [disabled]="submit()"
                                (onClick)="onCancelEditBtnClick()"
                            />
                        </div>
                    </div>
                </form>
            }
            @else { 
                <div class="presentation">
                    <div class="flex align-items-center gap-2">
                        <!-- Name label -->
                        <h2 class="text-xl font-semibold m-0">
                            {{ account.name }}
                        </h2>
                        <!-- Edit button -->
                        <button
                            type="button"
                            aria-label="Edit profile name"
                            class="edit-button"
                            (click)="onEditBtnClick()"
                        >
                            <span class="fa-solid fa-pen-to-square text-base"></span>
                        </button>
                    </div>
                    <!-- Roles label -->
                    <p class="text-sm font-light m-0">{{ roles() }}</p>
                </div>
            }
        </div>

        <p-divider align="left" type="solid">
            <span class="text-xl font-playfair">Sign in methods</span>
        </p-divider>
        
        <!-- Signin methods -->
        <profile-signin-methods/>
    </div>
}
