@if (account$ | async; as account) {
    <div class="container">
        <!-- User Presentation -->
        <div class="grid my-5">
            <!-- Picture -->
            <div class="col-12 md:col-5 flex justify-content-center">
                <div class="avatar">
                    @if (account.picture) {
                        <img class="border-circle" [src]="convertToLargerImageUrl(account.picture)" alt="user picture" referrerpolicy="no-referrer">
                    }
                </div>
            </div>
            <!-- Welcome text -->
            <div class="col-12 md:col-7 md:border-left-1 welcome-box">
                <p class="text-3xl font-light">
                    <span>👋 Hello, </span>
                    <span class="font-semibold md:mr-3">{{ account.name }}</span>
                </p>
            </div>
        </div>

        <p-divider align="left" type="solid">
            <span class="text-xl font-playfair">Sign in methods</span>
        </p-divider>
        
        <!-- Signin methods -->
        <profile-signin-methods/>
    </div>
}
