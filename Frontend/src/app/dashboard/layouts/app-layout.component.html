<div class="pattern min-h-screen overflow-hidden">

    <div class="container flex justify-center mx-auto">
        <!-- Navigation Bar -->
        <div id="top-bar" class="w-full fixed sm:max-w-screen-sm">
            <app-main-bar
                (onShowSideBar)="showSideBar($event)"
                (onHideSideBar)="hideSideBar()"
            />
        </div>
        <!-- Main Container -->
        <div id="main-container" class="w-full min-h-screen flex flex-col justify-between">
            <div class="flex-auto bg-white p-5 rounded-3xl">
                <!-- Bread crumb -->
                <app-bread-crumb [url]="activatedUrl" />
                <!-- Component Title -->
                <p *ngIf="titleComponent" class="py-3 text-2xl font-bold">{{ titleComponent }}</p>
                <!-- Router Outlet -->
                <router-outlet />
            </div>
            <footer class="text-center p-5 my-5">
                <p class="bg-slate-100 inline p-2 rounded-2xl text-retropurple-900">
                    © <a class="font-bold" href="https://www.jomacode.com/" target="_blank">jomacode</a>
                </p>
            </footer>
        </div>
    </div>

</div>

<!-- Side Bar -->
<p-sidebar
    #sideBar
    [(visible)]="this.isSideBarVisible"
    [position]="width < 640 ? 'bottom' : 'right'"
    [styleClass]="width < 640 ? 'h-1/2 rounded-t-3xl' : ''"
>
    <p-menu
        [model]="menuItems"
        styleClass="w-full"
    />
</p-sidebar>
