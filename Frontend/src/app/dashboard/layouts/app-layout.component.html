<div class="min-h-screen flex flex-column">
    <!-- Top navigation bar -->
    <header class="z-1 w-full fixed">
        <app-main-bar
            (onShowNavigationSidebar)="showSidebar('Navigation', $event)"
            (onShowSearchSidebar)="showSidebar('Searching')"
        />
    </header>
    <!-- Main container -->
    <section id="main-container">
        <!-- Component Title -->
        <h1 *ngIf="titleComponent().length > 0" class="text-2xl font-medium mt-0 mb-4">{{ titleComponent() }}</h1>
        <!-- Router Outlet -->
        <router-outlet />
    </section>
</div>

<!-- Side Bar -->
<ng-container *ngIf="sideBarConfig() as config">
    <p-sidebar
        id="main-sidebar"
        styleClass="h-full"
        showCloseIcon="false"
        [modal]="false"
        [visible]="this.isSidebarVisible()"
        [position]="width <= 576 ? 'bottom' : 'left'"
    >
        <!-- Header -->
        <ng-template pTemplate="header">
            <div class="flex w-full justify-content-between align-content-center">
                <h2 class="m-0 font-medium">{{ config.title }}</h2>
                <button
                    class="border-none cursor-pointer p-2"
                    (click)="toggleSidebar()"
                >
                    <span class="fa fa-close text-base"></span>
                </button>
            </div>
        </ng-template>
        <!-- Content -->
        <ng-template pTemplate="content">
            <div class="w-full">
                @switch ( config.contentType ) {
                    @case ('Navigation') {
                        <p class="text-2xl text-center font-light">
                            Hello, <span class="font-normal">{{ userName }}</span>
                        </p>
                        <p-menu
                            [model]="config.navigationItems"
                            styleClass="w-full px-3"
                        />
                    }
                    @case ('Searching') {
                        <app-quick-search (onSearchNavigate)="toggleSidebar()"/>
                    }
                }
            </div>
        </ng-template>
    </p-sidebar>
</ng-container>
