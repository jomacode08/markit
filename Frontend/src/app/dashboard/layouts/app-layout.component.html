<div class="bg-main-black min-h-screen overflow-hidden">
    <div class="mx-0 md:mx-8 flex justify-content-center mx-auto">
        <!-- Navigation Bar -->
        <div id="top-bar" class="z-1 w-full fixed">
            <app-main-bar
                (onShowSideBar)="showSideBar($event)"
                (onHideSideBar)="hideSideBar()"
            />
        </div>
        <!-- Main Container -->
        <div id="main-container" class="w-full min-h-screen flex flex-column justify-content-between">
            <div class="border-1 border-white-alpha-60 flex-auto p-3 md:border-round-xl">
                <!-- Bread crumb -->
                <app-bread-crumb [url]="activatedUrl" />
                <!-- Component Title -->
                <p *ngIf="titleComponent" class="text-2xl font-fraunces font-semibold">{{ titleComponent }}</p>
                <!-- Router Outlet -->
                <router-outlet />
            </div>
            <footer class="text-center p-5">
                <p class="inline px-3 py-2">
                    <a class="font-bold hover:text-purple-200" href="https://www.jomacode.com/" target="_blank">© jomacode</a>
                </p>
            </footer>
        </div>
    </div>
</div>

<!-- Side Bar -->
<p-sidebar
    #sideBar
    id="main-sidebar"
    [(visible)]="this.isSideBarVisible"
    [position]="width < 640 ? 'bottom' : 'right'"
    [styleClass]="width < 640 ? 'h-50 border-round-top-3xl' : ''"
>
    <div>
        <p class="text-2xl text-center">
            Hello, <span class="font-bold">{{ userName }}</span>
        </p>
        <p-menu
            [model]="menuItems"
            styleClass="w-full"
        />
    </div>
</p-sidebar>
