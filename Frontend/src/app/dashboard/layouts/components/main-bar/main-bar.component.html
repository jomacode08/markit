<div id="main-bar" class="border-bottom-1 border-white-alpha-20">
    <div class="flex align items-center gap-3">
        <!-- Brand Name -->
        <div class="brand-title">
            <span class="flex align-items-center mr-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 14 14">
                    <path class="cards-shape" fill="#ffffff" fill-rule="evenodd" d="M7.56.33a.48.48 0 0 0-.587.339L4.64 9.377a.48.48 0 0 0 .34.587l6.083 1.63a.48.48 0 0 0 .587-.34l2.335-8.707a.48.48 0 0 0-.34-.588L7.561.33ZM3.433 9.053l1.596-5.955L.356 4.349a.48.48 0 0 0-.34.588l2.335 8.707a.48.48 0 0 0 .587.34l6.084-1.63l.023-.007l-4.39-1.175a1.73 1.73 0 0 1-1.223-2.12Z" clip-rule="evenodd"/>
                </svg>
            </span>
            <div class="brand">{{ MAIN_BAR_BRAND_TITLE }}</div>
        </div>
        <!-- Add mark button -->
         <button
            type="button"
            id="new-mark-btn"
            class="gradient-background hidden sm:block"
            (click)="onNewMarkButtonClick()"
        >
            <div>
                <span class="fa fa-plus text-xs mr-1"></span>New
            </div>
         </button>
    </div>

    <!-- Navigation buttons -->
    <div class="flex align-items-center gap-3">
        <!-- Search -->
        <p-button
            styleClass="nav-button p-2 up-down-transition"
            icon="fa fa-search"
        />
        <!-- Menu -->
        <p-button
            styleClass="nav-button p-2 up-down-transition"
            icon="fa fa-bars"
            (onClick)="onShowSideBar.emit(this.navigationRutes)"
        />
        <!-- User Picture -->
        <div class="p-avatar" (click)="onShowSideBar.emit(this.userActions)">
            @if ( userPictureUrl ) {
                <img
                    [src]="userPictureUrl"
                    class="border-circle"
                    alt="user picture"
                    referrerpolicy="no-referrer"
                >
            }
            @else {
                <i class="fa-solid fa-glasses"></i>
            }
        </div>
    </div>
</div>
