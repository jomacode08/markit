<div class="wrap purple-wrap"></div>
<div class="wrap orange-wrap"></div>
<div class="h-full relative flex align-items-center justify-content-around bg-main-gray">
    <!-- Brand Name -->
    <div class="flex align-items-center">
        <h1 class="m-0 mr-3 font-bold text-3xl">Mark it</h1>
        <lord-icon trigger="in" src="/animated-icons/spinner-horizontal-dashed-circle.json" colors="primary:#f5f378" style="height: 2rem; width: 2rem;"></lord-icon>
    </div>
    
    <!-- Navigation buttons -->
    <div class="flex align-items-center gap-3">
        <!-- Search -->
        <p-button
            styleClass="nav-button p-2 up-down-transition" 
            icon="fa fa-search"
        />
        <!-- Menu -->
        <p-button
            styleClass="nav-button p-2 up-down-transition"
            icon="fa fa-bars"
            (onClick)="onShowSideBar.emit(this.navigationRutes)"
        />
        <!-- User Picture -->
        <div class="p-avatar" (click)="onShowSideBar.emit(this.userActions)">
            @if ( userPictureUrl ) {
                <img
                    [src]="userPictureUrl"
                    class="border-circle"
                    alt="user picture"
                    referrerpolicy="no-referrer"
                >
            }
            @else {
                <i class="fa fa-user text-lg"></i>
            }
        </div>
    </div>
</div>
