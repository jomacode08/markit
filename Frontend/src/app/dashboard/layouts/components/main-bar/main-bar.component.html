<nav>
    <!-- Brand Name -->
    <div class="brand md:mb-3 md:py-3 md:w-full">
        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24"><g fill="none" stroke="#ffffff99" stroke-linejoin="round" stroke-width="1.5"><path stroke-linecap="round" d="M11.7 1.173a.6.6 0 0 1 .6 0l8.926 5.154a.6.6 0 0 1 .3.52v10.307a.6.6 0 0 1-.3.52L12.3 22.826a.6.6 0 0 1-.6 0l-8.926-5.154a.6.6 0 0 1-.3-.52V6.847a.6.6 0 0 1 .3-.52z"/><path stroke-linecap="round" d="M17 15H7l5-8z"/><path d="M2.5 6.5L12 7m-9.5-.5L7 15m14.5-8.5L17 15m4.5-8.5L12 7V1m9.5 16.5L17 15M2.5 17.5L7 15m0 0l5 8l5-8"/></g></svg>
        <span class="brand-title md:hidden">{{ MAIN_BAR_BRAND_TITLE }}</span>
    </div>
    <!-- Navigation buttons -->
    <div class="flex-wrapper h-full md:flex-column md:justify-content-between md:w-full">
        <div class="flex-wrapper md:flex-column">
            <!-- Menu -->
            <p-button
                styleClass="nav-button up-down-transition"
                icon="fa fa-bars"
                (onClick)="onShowNavigationSidebar.emit(this.navigationRutes)"
            />
            <!-- Search -->
            <p-button
                styleClass="nav-button up-down-transition"
                icon="fa fa-search"
                (onClick)="onShowSearchSidebar.emit()"
            />
        </div>
        <!-- Profile -->
        <div class="profile md:py-3 md:w-full">
            <div class="p-avatar" (click)="onAvatarClick()">
                @if ( userPictureUrl ) {
                    <img
                        [src]="userPictureUrl"
                        class="border-circle"
                        alt="user picture"
                        referrerpolicy="no-referrer"
                    >
                }
            </div>
        </div>
    </div>
</nav>
