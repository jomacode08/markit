    <!-- Login Form -->
    <div class="flex flex-col w-full md:w-1/2 p-4 border-r-2 border-blue-950">
        <div class="flex flex-col flex-1 justify-center">
            <!-- Label -->
            <h1 class="text-4xl text-center font-bold text-blue-950 mb-5">Welcome <span class="text-retropurple-400">Back.</span></h1>
            <!-- Google Button -->
            <div class="w-3/4 flex flex-col mx-auto">
                <shared-general-button
                    label="Login with google"
                    icon="fa-brands fa-google"
                    backgroundColor="bg-retroyellow-500"
                    [disabled]="submit"
                    (click)="onGoogleBtnClick()"
                ></shared-general-button>
            </div>
        </div>
    </div>
    
    <!-- Side Container -->
    <div class="bg-retropurple-400 hidden md:block md:w-1/2 rounded-r-sm overflow-hidden">
        <div class="text-slate-50 h-full flex flex-col justify-center">
            <!-- Question Label -->
            <div class="px-5 text-4xl font-bold mb-5">Did you find something interesting?...</div>
            <!-- Typing animation -->
            <div class="px-5 text-3xl mb-5">
                <span class="animated-text">{{ mediaTypes[mediaCounter] }}</span>
            </div>
            <!-- Divider -->
            <div class="pattern mb-5 h-3"></div>
            <!-- Markit label -->
            <div class="px-5 flex items-center mb-5">
                <div class="flex items-center p-2 rounded-lg bg-white text-4xl mr-2">
                    <span class="mr-3 font-bold text-retropurple-900">Mark it!</span>
                    <lord-icon trigger="in" src="/animated-icons/spinner-horizontal-dashed-circle.json" colors="primary:#C28FE0" style="height: 3rem; width: 3rem;"></lord-icon>
                </div>
            </div>
        </div>
    </div>
