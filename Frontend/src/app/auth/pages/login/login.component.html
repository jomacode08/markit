    <!-- Login Form -->
    <div class="surface-100 border-round-lg md:border-noround-right flex flex-column w-full md:w-6 p-4">
        <div class="flex flex-column flex-1 justify-content-center">
            <!-- Label -->
            <h1 class="text-4xl text-center font-bold text-purple-900 mb-5">Welcome <span class="text-purple-600">Back.</span></h1>
            <form
                [formGroup]="form"
                (submit)="onLogin()"
                autocomplete="off"
            >
                <div class="w-9 flex flex-column mx-auto">
                    <div class="mb-3">
                        <!-- Email -->
                        <label for="email" class="text-lg mb-2">Email</label>
                        <input 
                            id="email"
                            pInputText
                            formControlName="email"
                            type="text"
                            placeholder="Email address"
                            class="w-full"
                            autocomplete="off"
                        >
                        <shared-error-field
                            *ngIf="isInvalidField('email')"
                            [validationField]="getValidationField('email', 'masc')">
                        </shared-error-field>
                    </div>
                    <div class="mb-5">
                        <!-- Password -->
                        <label for="password" class="text-lg mb-2">Password</label>
                        <p-password
                            inputId="password"
                            formControlName="password"
                            placeholder="Password"
                            styleClass="w-full"
                            inputStyleClass="w-full"
                            autocomplete="off "
                            [toggleMask]="true"
                            [feedback]="false"
                        >
                        </p-password>
                        <shared-error-field
                            *ngIf="isInvalidField('password')"
                            [validationField]="getValidationField('password', 'masc')">
                        </shared-error-field>
                    </div>
                    <!-- Login submit -->
                    <div class="mb-5">
                        <shared-general-button
                            label="Login"
                            backgroundColor="bg-yellow-500"
                            [disabled]="submit"
                            [submit]="true"
                        ></shared-general-button>
                    </div>
                    <!-- Google Button -->
                    <div>
                        <shared-general-button
                            label="Sign in with google"
                            icon="fa-brands fa-google"
                            backgroundColor="bg-white"
                            [disabled]="submit"
                            (click)="onGoogleLogin()"
                        ></shared-general-button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Side Container -->
    <div class="blured border-round-right-lg hidden md:block md:w-6 overflow-hidden">
        <div class="text-white h-full flex flex-column justify-content-center">
            <!-- Question Label -->
            <div class="px-5 text-4xl font-bold mb-5">Did you find something interesting?...</div>
            <!-- Typing animation -->
            <div class="px-5 text-3xl mb-5">
                <span class="animated-text">{{ mediaTypes[mediaCounter] }}</span>
            </div>
            <!-- Markit label -->
            <div class="px-5 flex align-items-center mb-5">
                <div class="flex align-items-center p-2 border-round-lg bg-white text-4xl mr-2">
                    <span class="mr-3 font-bold text-purple-700">Mark it!</span>
                    <lord-icon trigger="in" src="/animated-icons/spinner-horizontal-dashed-circle.json" colors="primary:#C28FE0" style="height: 3rem; width: 3rem;"></lord-icon>
                </div>
            </div>
        </div>
    </div>
