<!-- Default Toast -->
<p-toast key="default" position="top-right" [preventOpenDuplicates]="true"></p-toast>
<!-- Alert Toast -->
<p-toast position="center" key="alert">

    <ng-template let-message #message>
        <div class="grid">
            <!-- Header -->
            <div class="col-12 text-center">
                <i [class]="message.icon ?? 'pi pi-exclamation-circle'"></i>
            </div>
            <div class="col-12 text-center">
                <h4>{{ message.summary }}</h4>
            </div>
            <!-- Body -->
            <div class="col-12 text-center">
                <!-- Detalles-->
                <div>{{ message.detail }}</div>
            </div>
            <!-- Footer -->
            <div class="col-12">
                <button 
                    class="p-button-success w-full"
                    label="Aceptar"
                    type="button"
                    pButton
                    (click)="onClose()"
                ></button>
            </div>            
        </div>
    </ng-template>

</p-toast>
<!-- Validation Toast -->
<p-toast position="top-right" key="validation">

    <ng-template let-message #message>
        <div class="grid">
            <div class="col-12 flex align-items-center text-lg">
                <i class="pi pi-exclamation-circle mr-2" style="font-size: 2rem;"></i>
                <span class="font-semibold">{{ message.summary }}</span> 
            </div>
            <div class="col-12">
                <div class="mb-2" *ngFor="let validationError of message.data | keyvalue">
                    <div class="font-medium">{{ validationError.key }}</div>
                    <div class="ml-2" *ngFor="let validation of $any(validationError).value">
                        - {{ validation }}
                    </div>
                </div>
            </div>
        </div>
    </ng-template>

</p-toast>
<!-- Confirm Dialog -->
<p-confirmDialog styleClass="max-w-10 md:max-w-25rem" #confirmDialog>
    <ng-template #message let-message>
        <div class="p-confirm-dialog-message">
            {{ message.message }}
        </div>
    </ng-template>
</p-confirmDialog>
