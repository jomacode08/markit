<p-drawer
    #sidebar
    id="floating-menu"
    styleClass="floating-menu"
    position="bottom"
    showCloseIcon="false"
    [modal]="dismissible()"
    [dismissible]="dismissible()"
    [(visible)]="isSideBarVisible"
>
    <ng-template #header>
        <!-- Close button -->
        <button
            id="closeBtn"
            type="button"
            aria-label="Close menu"
            (click)="toggle()"
        >
            <span class="fa-solid fa-angles-left"></span>
        </button>
    </ng-template>
    <div class="scroll-container">
        <!-- Back item button -->
        <button
            *ngIf="isBackButtonVisible"
            type="button"
            class="item back-button"
            (click)="onBackButtonClick()"
        >
            <span class="active fa fa-angles-left"></span>
        </button>

        <!-- Edition options -->
        @for (option of currentOptions()(); track $index) {
            <button 
                type="button"
                class="item"
                (click)="onOptionClick(option)"
                [disabled]='option.isDisabled ? option.isDisabled() : false'
            >
                <div class="flex gap-1 flex-1 flex-column justify-content-end align-items-center">
                    <!-- Icon -->
                    <span
                        [class]="option.icon"
                        [ngClass]="{
                            'icon' : true,
                            'active' : (option.isActive?.() && !option.color) 
                        }"
                        [style]="getColorStyleDeclaration(option.color)"
                    ></span>
                    <!-- Label -->
                    <span 
                        class="label"
                        [ngClass]="{'font-semibold' : option.isActive?.() }"
                    >
                        {{ option.label }}
                    </span>
                </div>
            </button>
        }
    </div>
</p-drawer>
