<!-- Form -->
<div class="container relative">
    <form
        *ngIf="!loading; else skeleton"
        [formGroup]="form"
        (submit)="onSubmit()"
        autocomplete="off"
    >
        <!-- Name -->
        <div class="my-5">
            <input
                id="name"
                placeholder="New Mark"
                pInputText
                formControlName="name"
                type="text"
                class="w-full px-0 text-2xl font-fraunces font-semibold"
            />
            <shared-error-field
                *ngIf="isInvalidField('name')"
                [validationField]="getValidationField('name', 'masc', 'name title')">
            </shared-error-field>  
        </div>

        <!-- Blocks -->
        <ng-container formArrayName="blocks">
            <div class="grid">
                @for (blockForm of currentBlocks.controls; track $index; let i = $index;) {
                    <div 
                        [class]="'col-12 md:col-' + blockForm.value['cols'] + ' mb-3'"
                        [formGroup]="castAbstractControlToFormGroup(blockForm)"
                    >
                        <!-- Text editor -->
                        <marks-text-editor
                            [color]="blockForm.value['color']"
                            (onEditorSelected)="onEditorSelected($event)"
                            (onOptionsButtonClicked)="onBlockOptionsButtonClick(i)"
                            formControlName="content"
                        />
                    </div>
                }
            </div>
        </ng-container>

        <!-- Temporary Submit button -->
        <div class="grid mt-5">
            <div class="col-12 md:col-6">
                <shared-general-button
                    type="primary"
                    label="Save"
                    icon="fa fa-floppy-disk"
                    [submit]="true"
                    [disabled]="submit"
                ></shared-general-button>
            </div>
            <div class="col-12 md:col-6">
                <shared-general-button
                    type="cancel"
                    label="Cancel"
                    icon="fa-solid fa-angles-left"
                    [disabled]="submit"
                    (click)="onCancel()"
                ></shared-general-button>
            </div>
        </div>
    </form>
</div>

<!-- Floating font menu button -->
<p-button
    styleClass="floating-button"
    icon="fa fa-font"
    size="large"
    [rounded]="true"
    [raised]="true"
    (onClick)="changeMarkMenuState()"
/>

<!-- Mark menu -->
<marks-floating-menu
    [menuOptions]="fontOptions()"
    [visible]="isMarkMenuVisible"
/>

<!-- Block menu -->
<marks-floating-menu
    [menuOptions]="blockOptions()"
    [visible]="isBlockMenuVisible"
/>

<!-- Loading skeleton template -->
<ng-template #skeleton>
    <div class="w-full my-5">
        <p-skeleton height="3rem"/>
    </div>
    <div class="w-full mb-5">
        <p-skeleton height="200px"/>
    </div>
    <div class="grid">
        <div class="col-12 md:col-6">
            <p-skeleton height="2.5rem"/>
        </div>
        <div class="col-12 md:col-6">
            <p-skeleton height="2.5rem"/>
        </div>
    </div>
</ng-template>
