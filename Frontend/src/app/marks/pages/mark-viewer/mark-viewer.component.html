<ng-container *ngIf="currentMark.id > 0 else skeleton">
    <!-- Form -->
    <section class="container">
        <nav id="markMenuBar">
            <div class="flex gap-2">
                <!-- Breadcrumb -->
                <div class="mark-breadcrumb max-w-16rem sm:max-w-25rem md:max-w-30rem lg:max-w-max">
                    <button
                        type="button"
                        aria-label="collection"
                        class="item collection"
                        (click)="onCollectionBtnClick()"
                    >
                        {{ currentMark.collectionName }}
                    </button>
                    <span class="separator">/</span>
                    <span class="item">{{ currentMark.emoji }}{{ currentMark.name }}</span>
                </div>
                <!-- Auto save indicators -->
                <div class="autosave-indicators">        
                    <ng-container [ngSwitch]="saveState()">
                        <div *ngSwitchCase="saveStateType.saving" class="status">
                            <span class="fa fa-arrows-rotate spinner"></span>
                            <span class="hidden md:block">Saving...</span>
                        </div>
                        <div *ngSwitchCase="saveStateType.saved" class="status">
                            <span class="fa fa-check saved"></span>
                            <span class="hidden md:block">Saved</span>
                        </div>
                        <button
                            *ngSwitchCase="saveStateType.error"
                            type="button"
                            class="status cursor-pointer hover:text-white-alpha-90 border-none"
                            (click)="onErrorSavingButtonClick()"
                            >
                            <span class="fa fa-triangle-exclamation error"></span>
                            <span class="hidden md:block">Error saving (click to retry)</span>
                        </button>
                    </ng-container>
                </div>
            </div>
            <div class="flex gap-3">
                <!-- Block title -->
                <span class="text-secondary hidden md:inline">
                    {{ currentBlock.title }}
                </span>
                <!-- Block navigators -->
                <div class="navigators flex align-items-center gap-3">
                    <button
                        type="button"
                        aria-label="Navigate to left"
                        pTooltip="Go to left"
                        tooltipPosition="top"
                        [disabled]="this.currentBlockIndex() === 0"
                        (click)="navigateBackward()"
                    >
                        <span class="fa-solid fa-angle-left"></span>
                    </button>
                    <button
                        type="button"
                        aria-label="Navigate to right"
                        pTooltip="Go to right"
                        tooltipPosition="top"
                        [disabled]="this.currentBlockIndex() === this.currentBlocks.length - 1"
                        (click)="navigateForward()"
                    >
                        <span class="fa-solid fa-angle-right"></span>
                    </button>
                </div>
                <!-- New block button -->
                <button
                    id="newBlockButton"
                    type="button"
                    aria-label="Block menu"
                    pTooltip="Block menu"
                    (click)="openBlockMenuDialog(this.currentBlocks.value)"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="1.25rem" height="1.25rem" viewBox="0 0 24 24"><g fill="none" stroke="#e9ecef" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
                        <path d="M21 7.353v9.294a.6.6 0 0 1-.309.525l-8.4 4.666a.6.6 0 0 1-.582 0l-8.4-4.666A.6.6 0 0 1 3 16.647V7.353a.6.6 0 0 1 .309-.524l8.4-4.667a.6.6 0 0 1 .582 0l8.4 4.667a.6.6 0 0 1 .309.524"/>
                        <path d="m3.528 7.294l8.18 4.544a.6.6 0 0 0 .583 0l8.209-4.56M12 21v-9"/></g>
                    </svg>
                </button>
            </div>
        </nav>
        <form
            [formGroup]="form"
            autocomplete="off"
        >
            <!-- Header -->
            <div id="markHeader" class="md:mt-4">
                <app-emoji-picker
                    defaultIconClass="fa-regular fa-note-sticky"
                    [currentEmoji]="currentMark.emoji"
                    (emojiClick)="onEmojiSelected($event)"
                    (emojiDeleted)="onEmojiDeleted()"
                />
                <input 
                    id="markName"
                    type="text" 
                    formControlName="inputName"
                    [placeholder]="MARK_NAME_PLACEHOLDER"
                    (input)="onMarkNameInputChanged($event)"
                >
            </div>
            <!-- Blocks gallery -->
            <ng-container formArrayName="blocks">
                <p-galleria
                    #blockGalleria
                    id="blockGalleria"
                    [value]="currentBlocks.controls"
                    [showIndicators]="false"
                    [showThumbnails]="false"
                    [activeIndex]="currentBlockIndex()"
                >
                    <ng-template let-block pTemplate="item">
                        <div [formGroup]="castAbstractControlToFormGroup(block)">
                            <marks-block     
                                formControlName="content"
                                [title]="block.value['title']"
                                (onEditorSelected)="onEditorSelected($event)"
                                (onValueChange)="onEditorValueChanged($event)"
                            />
                        </div>
                    </ng-template>   
                </p-galleria>
            </ng-container>
        </form>
    </section>

    <!-- Floating font menu button -->
    <shared-floating-action-button 
        iconClass="fa fa-font"
        (onClick)="onTextFormattingButtonClick()"
    />
    <!-- Floating menu -->
    <shared-floating-menu
        [options]="floatingMenuOptions"
        [visible]="isFloatingMenuVisible"
    />
</ng-container>

<!-- Loading skeleton template -->
<ng-template #skeleton>
    <div class="container mt-6">
        <div class="w-full mb-5">
            <p-skeleton height="3rem"/>
        </div>
        <div class="w-full mb-5">
            <p-skeleton height="200px"/>
        </div>
        <div class="grid">
            <div class="col-12 md:col-6">
                <p-skeleton height="2.5rem"/>
            </div>
            <div class="col-12 md:col-6">
                <p-skeleton height="2.5rem"/>
            </div>
        </div>
    </div>
</ng-template>
