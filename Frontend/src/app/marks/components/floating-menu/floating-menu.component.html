<p-sidebar
    #sidebar
    id="floating-menu"
    position="bottom"
    [visible]="visible"
    [modal]="false"
    [dismissible]="false"
>
    <div class="scroll-container">
        <!-- Back button -->
        <button *ngIf="isBackButtonVisible" type="button" (click)="onBackButtonClick()">
            <span class="active fa fa-angles-left"></span>
        </button>

        <!-- Edition options -->
        @for (option of currentMenuOptions; track $index) {
            <button 
                type="button" 
                (click)="onOptionClick(option)"
                [disabled]='option.isDisabled ? option.isDisabled() : false'
            >
                <div class="flex flex-column gap-1">
                    <!-- Icon -->
                    <span
                        [class]="option.icon"
                        [ngClass]="{ 'active' : option.isActive ? option.isActive() : false }"
                        [style]="getColorStyleDeclaration(option.color)"
                    ></span>
                    <!-- Label -->
                    <span class="text-base">
                        {{ option.label }}
                    </span>
                </div>
            </button>
        }
    </div>
</p-sidebar>
