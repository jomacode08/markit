<!-- Text editor -->
 <div class="relative">
    <!-- Menu options button -->
    <div class="absolute z-1">
        <i (click)="this.onOptionsButtonClicked.emit()" class="fa fa-shapes"></i>
    </div>
     <tiptap-editor
         id="editor"
         [editor]="editor"
         [(ngModel)]="input"
         (ngModelChange)="onChange($event)"
         (blur)="onTouched()"
         (mousedown)="onEditorClick()"
     />
 </div>
