<form
    [formGroup]="form"
    (submit)="onLoadGistUrl()"
    autocomplete="off"
>
    <div class="load-container flex flex-column">
        <div class="grid">
            <div class="col-12 md:col-9">
                <input
                    pInputText
                    id="url"
                    formControlName="url"
                    type="text"
                    placeholder="https://gist.github.com/username/..."
                    class="w-full"
                    autocomplete="off"
                >
            </div>
            <div class="col-12 md:col-3">
                <p-button
                    type="submit"
                    size="small"
                    label="Load Gist"
                    severity="primary"
                />
            </div>
        </div>
        <shared-error-field
            *ngIf="isInvalidField('url')"
            [validationField]="getValidationField('url')"
        />
    </div>
</form>
