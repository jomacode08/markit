<p-panel [styleClass]="color" [toggleable]="toggeable" [collapsed]="collapsed">

    <ng-template *ngIf="toggeable" pTemplate="header">
        <div class="title w-full">
            <input
                [(ngModel)]="title"
                (ngModelChange)="onTitleChange($event)"
                placeholder="New Block"
                pInputText
                type="text"
                class="transparent w-full p-0 font-semibold"
            />
        </div>
    </ng-template>

    <ng-template *ngIf="toggeable" pTemplate="icons">
        <button 
            type="button"
            class="p-panel-header-icon p-link mr-2"
            (click)="this.onOptionsButtonClicked.emit()"
        >
            <span class="fa fa-shapes"></span>
        </button>
    </ng-template>

    <ng-template pTemplate="content">
        <tiptap-editor
            id="editor"
            [editor]="editor"
            [(ngModel)]="input"
            (ngModelChange)="onChange($event)"
            (blur)="onTouched()"
            (mousedown)="onEditorClick()"
        />

        @if (this.editor.isEmpty) {
            <p-skeleton styleClass="mb-1" animation="none" height="1rem"/>
            <p-skeleton styleClass="mb-1" animation="none" height="1rem" width="20rem"/>
            <p-skeleton styleClass="mb-1" animation="none" height="1rem" width="10rem"/>
        }

    </ng-template>

</p-panel>
