services:
  postgres:
    image: postgres:17-alpine
    container_name: markit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-markitdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-c wal_level=logical"
    ports:
      # Port mapping format: "host_port:container_port"
      # Maps ${DB_PORT} on your machine to PostgreSQL's default port 5432 inside the container
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${DB_NAME:-markitdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Note: docker-compose automatically reads .env file if present in the project directory

volumes:
  postgres_data:
    driver: local
